# Application name
spring.application.name=app
# HTTP port
server.port=${PORT:8080}
# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}
# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading in the web layer
spring.jpa.open-in-view=false
# JWT signing key (HS256, at least 32 bytes)
app.jwt.secret=${APP_JWT_SECRET:}
# Access token lifetime
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:15m}
# Refresh token lifetime
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:30d}
# First admin user, created only while the user table is empty
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:}
# Comma-separated CORS origins
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}
# Base URL used in email links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
# Mail mode, required: log (development: emails and their tokens go to the log) or smtp (send them)
app.mail.mode=${APP_MAIL_MODE:}
# Sender address
app.mail.from=${APP_MAIL_FROM:no-reply@example.com}
# SMTP server (used when app.mail.mode=smtp)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
